[workspace]
resolver = "3"
members = ["crates/pin-core", "crates/pin-pg", "crates/pin-kernels"]
default-members = ["crates/pin-core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/YogeshPandar/PIN"
publish = false

[workspace.dependencies]
pin-core = { path = "crates/pin-core" }
pgrx = { version = "=0.19.2", default-features = false }
pgrx-pg-sys = { version = "=0.19.2", default-features = false }
cc = "=1.2.38"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"

[profile.dev]
panic = "unwind"
