name: apply owner frontier qualification staging 2

on:
  push:
    branches:
      - automation/owner-frontier-qualification-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: verify staged payload parts
        shell: bash
        run: |
          set -euo pipefail
          for part in .github/owner-frontier-parts/part*; do
            printf '%s bytes=' "$part"
            tr -d '\r\n' < "$part" | wc -c
            tr -d '\r\n' < "$part" | sha256sum
          done
          exit 1
