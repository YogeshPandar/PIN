name: G0 boundary

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select exact Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check protocol oracle and source contracts
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/check_contracts.py
          bash -n tools/pg_smoke.sh
          bash -n tools/g2_qualification.sh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test pure contracts
        if: success() || failure()
        run: cargo test --locked -p pin-core -- --nocapture
      - name: Lint pure contracts
        if: success() || failure()
        run: cargo clippy --locked -p pin-core --all-targets -- -D warnings
      - name: Build API documentation
        if: success() || failure()
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p pin-core --no-deps

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select exact Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev bison flex pkg-config libreadline-dev zlib1g-dev libssl-dev libicu-dev
      - name: Build exact PostgreSQL source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/postgres-src"
          git -C "$RUNNER_TEMP/postgres-src" remote add origin https://github.com/postgres/postgres.git
          git -C "$RUNNER_TEMP/postgres-src" fetch --depth 1 origin 724edf9bde9d356724ad384a2e196edc3c9f80f7
          git -C "$RUNNER_TEMP/postgres-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/postgres-src" rev-parse HEAD)" = 724edf9bde9d356724ad384a2e196edc3c9f80f7
          cd "$RUNNER_TEMP/postgres-src"
          ./configure --prefix="$RUNNER_TEMP/pg18" --enable-cassert --with-openssl
          make -j2
          make install
          echo "$RUNNER_TEMP/pg18/bin" >> "$GITHUB_PATH"
          echo "PGRX_PG_CONFIG_PATH=$RUNNER_TEMP/pg18/bin/pg_config" >> "$GITHUB_ENV"
      - name: Compile extension with matching tooling
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock
          cargo install cargo-pgrx --version 0.19.2 --locked
          cargo pgrx init --pg18 "$PGRX_PG_CONFIG_PATH"
          cargo build --locked -p pin-pg
          cd crates/pin-pg
          cargo pgrx install --pg-config "$PGRX_PG_CONFIG_PATH"
          git diff --exit-code -- ../../Cargo.lock
      - name: Test normal installation and lifecycle
        run: bash tools/pg_smoke.sh
      - name: Lint host boundary
        run: cargo clippy --locked -p pin-pg --features test-hooks --all-targets -- -D warnings
      - name: Install guarded error probes
        working-directory: crates/pin-pg
        run: |
          cargo pgrx install --features test-hooks --pg-config "$PGRX_PG_CONFIG_PATH"
          git diff --exit-code -- ../../Cargo.lock
      - name: Test error boundaries and hook permissions
        env:
          PIN_G0_TEST_HOOKS: '1'
        run: bash tools/pg_smoke.sh
      - name: Test G2 transactional and recovery qualification
        run: bash tools/g2_qualification.sh
      - name: Preserve disposable cluster logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g0-postgres-logs
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
