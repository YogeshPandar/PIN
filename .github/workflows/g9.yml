name: G9 grouped storage

on:
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/g9.yml'
      - 'tests/sql/g9_*'
      - 'tests/sql/issue14_recheck.sql'
      - 'tools/g9_*'
      - 'tests/test_g9_*'
      - 'tests/support/g9_*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bare-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Check allocation-free no_std kernels
        run: cargo check --locked -p pin-kernels --no-default-features --lib
      - name: Check scalar grouped truth tables
        run: cargo test --locked -p pin-kernels --test grouped
      - name: Check grouped physical storage and recovery
        run: cargo test --locked -p pin-core --lib --test g9_grouped --test g9_storage --test issue14_frontier
      - name: Check optimized grouped storage and scalar kernels
        run: |
          cargo test --locked --release -p pin-core --lib --test g9_grouped --test g9_storage --test issue14_frontier
          cargo test --locked --release -p pin-kernels --test grouped
      - name: Lint grouped contracts
        run: cargo clippy --locked -p pin-core -p pin-kernels --all-targets -- -D warnings
      - name: Check host driver contracts
        run: python3 -m unittest discover -s tests -p 'test_g9_*.py' -v
